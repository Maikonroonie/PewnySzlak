name: pewnyszlak

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pewnyszlak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pewnyszlak}
      POSTGRES_DB: ${POSTGRES_DB:-pewnyszlak}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./data/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pewnyszlak} -d ${POSTGRES_DB:-pewnyszlak}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pewnyszlak}:${POSTGRES_PASSWORD:-pewnyszlak}@db:5432/${POSTGRES_DB:-pewnyszlak}
      PORT: 4000
      HOST: 0.0.0.0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-}
      RATE_LIMIT_REPORTS_PER_HOUR: ${RATE_LIMIT_REPORTS_PER_HOUR:-20}
      RATE_LIMIT_ASSISTANT_PER_HOUR: ${RATE_LIMIT_ASSISTANT_PER_HOUR:-60}
    ports:
      - "${API_PORT:-4000}:4000"
    command: ["npx", "tsx", "src/server.ts"]

  sync:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pewnyszlak}:${POSTGRES_PASSWORD:-pewnyszlak}@db:5432/${POSTGRES_DB:-pewnyszlak}
      OSM_PBF_URL: ${OSM_PBF_URL:-https://download.geofabrik.de/europe/poland/malopolskie-latest.osm.pbf}
      DATA_DIR: /data
      IMPORTER_CMD: python3 /importer/import_osm.py
      SYNC_OSM_CRON: ${SYNC_OSM_CRON:-0 3 * * 1}
      SYNC_SOURCES_CRON: ${SYNC_SOURCES_CRON:-30 4 * * *}
      NFZ_BENEFITS: ${NFZ_BENEFITS:-PORADNIA REHABILITACYJNA}
      ZDYKTY_MCP_URL: ${ZDYKTY_MCP_URL:-https://z-dykty.pl/api/mcp}
      PSOZ_MCP_URL: ${PSOZ_MCP_URL:-https://psoz.pl/api/mcp}
      NFZ_API_URL: ${NFZ_API_URL:-https://api.nfz.gov.pl/app-itl-api}
    volumes:
      - ./data:/data
    command: ["npx", "tsx", "src/sync/main.ts"]

  web:
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile.web
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:4000}
        EXPO_PUBLIC_MAP_STYLE_URL: ${EXPO_PUBLIC_MAP_STYLE_URL:-https://tiles.openfreemap.org/styles/liberty}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  dbdata:
